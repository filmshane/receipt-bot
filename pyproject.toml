[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "receipt-bot"
version = "0.1.0"
description = "Telegram Receipt Analysis Assistant (Excel + Gmail SMTP)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "python-telegram-bot>=21.0",
  "httpx>=0.27.0",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "openpyxl>=3.1.0",
  "aiosmtplib>=3.0.0",
  "python-dotenv>=1.0.0",
  "portalocker>=2.8.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0"]

[project.scripts]
receipt-bot = "receipt_bot.bot.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
